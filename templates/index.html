<!DOCTYPE html>
<html>
<head>
    <title>Bookclub</title>
</head>
<body>
    <h1>Bookclub</h1>

    {% if session.username %}
        <p>Logged in as {{ session.username }} — <a href="/logout">Log out</a></p>
        <p><a href="/books/new">Add a book</a></p>
    {% else %}
        <p><a href="/login">Log in</a> or <a href="/register">Register</a></p>
    {% endif %}

    <ul>
        {% for book in books %}
        <li>{{ book.title }} by {{ book.author }}</li>
        {% endfor %}
    </ul>
</body>
</html>
