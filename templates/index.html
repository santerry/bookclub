<!DOCTYPE html>
<html>
<head>
    <title>Bookclub</title>
</head>
<body>
    <h1>Bookclub</h1>

    {% if session.username %}
        <p>Logged in as {{ session.username }} — <a href="/logout">Log out</a></p>
        <p><a href="/books/new">Add a book</a></p>
    {% else %}
        <p><a href="/login">Log in</a> or <a href="/register">Register</a></p>
    {% endif %}

    <ul>
        {% for book in books %}
        <li>
            {{ book.title }} by {{ book.author }}
            {% if session.user_id == book.user_id %}
                — <a href="/books/{{ book.id }}/edit">Edit</a>
                — <form action="/books/{{ book.id }}/delete" method="post" style="display:inline">
                    <button type="submit">Delete</button>
                </form>
            {% endif %}
        </li>
        {% endfor %}
    </ul>
</body>
</html>
