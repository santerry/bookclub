<!DOCTYPE html>
<html>
<head>
    <title>Bookclub</title>
</head>
<body>
    <h1>Bookclub</h1>

    <form action="/" method="get">
        <input type="text" name="query" placeholder="Search by title or author" value="{{ query or '' }}">
        <button type="submit">Search</button>
    </form>

    {% if session.username %}
        <p>Logged in as {{ session.username }} — <a href="/logout">Log out</a></p>
        <p><a href="/books/new">Add a book</a></p>
    {% else %}
        <p><a href="/login">Log in</a> or <a href="/register">Register</a></p>
    {% endif %}

    <ul>
        {% for book in books %}
        <li>
            <a href="/books/{{ book.id }}">{{ book.title }}</a> by {{ book.author }}
        </li>
        {% endfor %}
    </ul>
</body>
</html>
